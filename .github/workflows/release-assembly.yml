name: Release assembly
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Verify frozen source revisions
        run: python3 scripts/check-release.py
      - name: Build the integrated frontend and backend
        run: docker compose build
